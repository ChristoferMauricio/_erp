<text x="55" y="900" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">ML</text>
<text x="78" y="901" fill="#94a3b8" font-size="12.5">= la función usa el microservicio (predicción / ingesta / export). El resto se sirve directo desde la base de datos.</text>
