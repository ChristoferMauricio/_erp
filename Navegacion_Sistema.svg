<text x="786" y="841" fill="#a78bfa" font-size="15" font-weight="700">Render · Microservicio FastAPI  [ML]</text>
<text x="786" y="862" fill="#94a3b8" font-size="12.5">Predicciones (Holt-Winters), validación/commit de Ingesta y generación del Export.</text>
